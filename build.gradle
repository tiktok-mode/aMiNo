plugins {
    id "idea"
    id "com.android.library" apply false
    id "org.jetbrains.kotlin.android" apply false
}

idea.module {
    excludeDirs += file("out")
}

subprojects { subproject ->
    plugins.withId("com.android.base") {
        android {
            compileSdk = 36
            buildToolsVersion = "36.0.0"
            ndkVersion = "29.0.14206865"
            defaultConfig {
                minSdk = 24
                targetSdk = 36
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}

def gitCommitCount = Integer.parseInt("git rev-list --count HEAD".execute([], project.rootDir).text.trim())
def baseVersionName = "2.2.1-alpha"  // v2.2.0-alpha: (1) CRITICAL FIELD FIX — LiveBrain parsed the RAW response envelope so escaped JSON decisions were NEVER found (say="" -> the empty «خلصت» row, nothing executed); extractContent now runs first (sandbox-proven: envelope=None, content=full launch-tiktok decision). (2) SESSION MEMORY — persisted multi-turn history (filesDir/sharingan/live_history.json): the eye resumes context after stop/start. (3) ONE EYE — giant top-center LiveEyeOverlay DELETED; the side bubble (Gemini placement) carries the whole Amaterasu look (black sclera, 3 tomoe, 2 black tears, phase-speed breathing) + setPhase. (4) NO SAFETY STOP — AgentOrchestrator MAX_TOOL_ROUNDS=12 removed entirely («Trop d'étapes d'outils» string deleted; runs until done or user stop), HISTORY_LIMIT 12→40. (5) RESTORED FULL SCREEN ANALYSIS — new screen_vision tool: real pixels → VL model description in TYPED chat too. (6) Live: idle-watch keeps a fresh frame every ~4s (Gemini-style continuity), vision rounds 3→8, honest fallback replaces the empty «خلصت», repair-retry for non-JSON answers, greeting context-resume. v2.1.0-alpha: SHARINGAN LIVE V2 (old panel/recorder deleted; ar-DZ voice in/out + transcript corrector; real-frame VL; chat relay). Old 1.6.0-alpha: capability repair r1421.
def isBeta = project.hasProperty("beta")
// v2.2.0-alpha: versionCode floor 1445 — the delivered v2.1.0-alpha-LIVE APK
// already has versionCode 1440; an EQUAL code makes Android refuse the update.
def versionFloor = 1446
ext {
    versionCode = Math.max(gitCommitCount, versionFloor)
    versionName = "${baseVersionName}${if (isBeta) "-beta" else ""}"
}
